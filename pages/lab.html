<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="奇怪的一角的网页实验与随机灵感。">
  <title>实验 | 奇怪的一角</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=20260715-board">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260715-board2">
  <script src="../assets/js/main.js?v=20260715-board" defer></script>
</head>
<body>
  <site-header root="../" active="lab"></site-header>

  <main class="page-main">
    <section class="page-hero">
      <div class="page-width">
        <p class="kicker">Small experiments</p>
        <h1>实验室</h1>
        <p class="lead-text">小工具和小游戏的试验场。它们不一定严肃，但都应该真的能用。</p>
      </div>
    </section>

    <section class="section-block compact-section">
      <div class="page-width">
        <div class="section-heading">
          <h2>可以打开的实验</h2>
          <p class="section-count">2 个</p>
        </div>

        <div class="lab-announcement-grid" aria-label="可以打开的实验">
          <a class="announcement-tile lab-announcement-tile theme-identity-v" href="https://identity-v-draw-simulator-cn.netlify.app/" target="_blank" rel="noopener noreferrer">
            <span class="announcement-number">02</span>
            <span class="announcement-body">
              <span class="announcement-meta"><span class="event-live-dot" aria-hidden="true"></span>NEW · 庄园新实验</span>
              <strong>奇怪的珍宝爽抽器</strong>
              <span class="announcement-description">选择卡池、连续抽取，再得到一份属于今天的庄园运势。</span>
            </span>
            <span class="announcement-action">进入庄园开抽</span>
            <span class="event-stamp" aria-hidden="true">IDENTITY V<br>DRAW EVENT</span>
          </a>

          <a class="announcement-tile lab-announcement-tile theme-side-quest" href="https://life-side-quest.netlify.app/" target="_blank" rel="noopener noreferrer">
            <span class="announcement-number">01</span>
            <span class="announcement-body">
              <span class="announcement-meta">轻量小游戏</span>
              <strong>人生支线任务</strong>
              <span class="announcement-description">抽一条日常支线，给今天换一个轻微而意外的走向。</span>
            </span>
            <span class="announcement-action">去抽一条支线</span>
          </a>
        </div>

        <div class="lab-grid">
          <div class="lab-intro">
            <p class="kicker">Quick prompt</p>
            <h2>随机灵感</h2>
            <p>不提供答案，只帮想法轻轻动一下。</p>
          </div>
          <div class="inspiration-box">
            <p class="inspiration-text" aria-live="polite" data-inspiration-output>先让它真实可用，再让它恰到好看。</p>
            <button class="button button-primary" type="button" data-inspiration-button>换一句</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
